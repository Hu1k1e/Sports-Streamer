version: '3.8'

services:
  streamed-proxy:
    build: https://github.com/Hu1k1e/Sports-Streamer.git#main
    container_name: streamed-proxy
    ports:
      - "7694:5000"
    environment:
      # IMPORTANT: If running on a local network for Jellyfin, replace 127.0.0.1 with 
      # the actual LAN IP of your Docker host (e.g., http://192.168.1.50:7694)
      - PROXY_HOST=http://127.0.0.1:7694
    restart: unless-stopped
